[project]
name = "nsfw-check-api"
version = "0.1.0"
description = "Detects NSFW images"
requires-python = ">=3.12,<3.13"
dependencies = [
    'torch>=2.9.1,<2.10; sys_platform == "linux"',
    "transformers>=5.3.0",
    "fastapi>=0.135.1",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
    "huggingface-hub==1.6.0",
]

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=9.0.2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

# CPU-only torch: the default PyPI wheel bundles CUDA and blows the image past a few GB
[[tool.pdm.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
include_packages = ["torch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "needs_model: requires the model files in ./model (skipped in CI)",
]
